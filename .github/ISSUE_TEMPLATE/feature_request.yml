name: Feature request
description: Propose a scoped, testable improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user workflow
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed safety boundary and refusal behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
