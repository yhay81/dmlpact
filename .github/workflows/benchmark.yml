name: Benchmark

on:
  pull_request:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DMLPACT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dmlpact_benchmark
      DMLPACT_POSTGRES_IMAGE: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: dmlpact_benchmark
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dmlpact_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and PostgreSQL client
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Capture raw benchmark
        run: benchmarks/run.sh benchmark-results.json
      - name: Upload raw measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmlpact-benchmark-${{ github.run_id }}
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 90
