name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Package manifest
        run: cargo package --locked --allow-dirty
      - name: v1 evidence gate tests
        run: |
          python3 -m unittest discover \
            -s scripts/tests -p 'test_verify_v1_evidence.py'
          python3 scripts/verify_v1_evidence.py \
            .github/v1-evidence.json --check-structure
      - name: Benchmark harness smoke
        shell: bash
        run: |
          bash -n benchmarks/run.sh
          for fixture in benchmarks/*.sql; do
            test -s "${fixture}"
          done
      - name: Artifact contract fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("tests/fixtures/contracts")
          for fixture in sorted(root.rglob("*.json")):
              with fixture.open(encoding="utf-8") as handle:
                  json.load(handle)
          for fixture in sorted(root.rglob("*.ndjson")):
              with fixture.open(encoding="utf-8") as handle:
                  records = [json.loads(line) for line in handle if line.strip()]
              if not records:
                  raise SystemExit(f"{fixture} has no events")
          PY
      - name: SQL policy corpus
        run: |
          python3 tests/fixtures/sql-policy/v0.1/generate_corpus.py --check
          cargo test --locked --test sql_policy_corpus
      - name: Machine contracts and completions
        shell: bash
        run: |
          cargo build --locked
          for document in plan receipt-event receipt-verification apply-result error capabilities; do
            target/debug/dmlpact schema "${document}" | jq -e . >/dev/null
          done
          target/debug/dmlpact capabilities | jq -e . >/dev/null
          target/debug/dmlpact contract | jq -e . >/dev/null
          for shell in bash zsh fish powershell elvish; do
            test -n "$(target/debug/dmlpact completions "${shell}")"
          done
      - name: Documentation inventory
        shell: bash
        run: |
          for file in README.md CONCEPT.md ROADMAP.md CHANGELOG.md RELEASING.md \
              SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md \
              SUPPORT.md ADOPTERS.md LICENSE docs/*.md; do
            test -s "${file}"
          done

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 \
            --locked --no-default-features
      - name: Audit Rust dependencies
        run: cargo +1.88.0 audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test library and CLI
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked

  postgres-live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust and PostgreSQL client
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Build debug binary
        run: cargo build --locked
      - name: Exercise commit, drift refusal, and trigger refusal
        run: bash tests/live_postgres.sh target/debug/dmlpact
